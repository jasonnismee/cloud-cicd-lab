spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tasks}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tasks}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local_only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
